<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pink calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf0f6;
    --ink: #4c4448;
    --mute: #8f858b;
    --out: #efe8ed;
    --on: #ebe3e8;
    --line: rgba(150, 135, 142, .13);
    --circle: #ffffff;
    --circle-ink: #d9c3cf;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #3d2b34; --ink: #f1dde6; --mute: #9d8590; --out: #4a3640; --on: #5a4450; --line: rgba(255,255,255,.12); --circle: #6b5260; --circle-ink: #f1dde6; }
  }
  :root[data-theme="dark"] { --line: rgba(255,255,255,.12); --bg: #3d2b34; --ink: #f1dde6; --mute: #9d8590; --out: #4a3640; --on: #5a4450; --circle: #6b5260; --circle-ink: #f1dde6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, "Noto Sans KR", sans-serif;
    font-feature-settings: "tnum" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased;
    font-size: 3.1vw;
    padding: 9.5vw 8vw 6vw;
    user-select: none;
  }
  .title { display: flex; justify-content: center; align-items: center; gap: .85em; font-size: 1.3em; font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: .2em .45em; border-radius: .3em; }
  .arrow { font-weight: 400; color: var(--ink); font-size: .95em; }
  .bar { display: flex; justify-content: center; align-items: center; gap: 1.8em; margin: .8em 0 1.4em; font-size: .95em; }
  .nav, .views { display: flex; align-items: center; gap: .3em; }
  .nav button { color: var(--ink); }
  .nav .today { color: var(--mute); font-weight: 400; padding: .2em 1em; }
  .views button { color: var(--mute); min-width: 2em; height: 2.2em; }
  .views button.on { background: var(--on); color: var(--ink); box-shadow: inset 0 1px 4px rgba(110, 90, 100, .16), inset 0 0 2px rgba(110, 90, 100, .08); }
  #body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow { text-align: center; font-weight: 700; padding: 0 0 .7em; border-bottom: 1px solid var(--line); }
  .d { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 2.4em; padding: .55em 12% 0 0; display: flex; justify-content: flex-end; align-items: flex-start; color: var(--mute); font-size: 1.05em; }
  .d:nth-child(7n+1) { border-left: 1px solid var(--line); }
  .d.out { background: var(--out); }
  .d.today { background: var(--out); }
  .wk .d { min-height: 6em; }
  .big { text-align: center; padding: 3em 0; font-size: 1.2em; }
  .big b { display: block; font-size: 3em; line-height: 1.2; }
  .agenda { text-align: center; color: var(--mute); padding: 3em 0; }
</style>
</head>
<body>
  <div class="title"><span id="mon"></span><button class="arrow" id="yp">&#8249;</button><span id="yr"></span><button class="arrow" id="yn">&#8250;</button></div>
  <div class="bar">
    <div class="nav"><button id="pv">&#8249;</button><button class="today" id="td">Today</button><button id="nx">&#8250;</button></div>
    <div class="views"><button data-v="M" class="on">M</button><button data-v="W">W</button><button data-v="D">D</button><button data-v="A">A</button></div>
  </div>
  <div id="body"></div>
<script>
(function () {
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var now = new Date(), view = "M", cur = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var $ = function (id) { return document.getElementById(id); };
  function same(a, b) { return a.toDateString() === b.toDateString(); }
  function add(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function monday(d) { return add(d, -((d.getDay() + 6) % 7)); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function head() { return DOW.map(function (n) { return '<div class="dow">' + n + "</div>"; }).join(""); }
  function render() {
    $("mon").textContent = MONTHS[cur.getMonth()];
    $("yr").textContent = cur.getFullYear();
    Array.prototype.forEach.call(document.querySelectorAll(".views button"), function (b) { b.classList.toggle("on", b.dataset.v === view); });
    var h = "";
    if (view === "M") {
      var s = monday(new Date(cur.getFullYear(), cur.getMonth(), 1));
      var first = new Date(cur.getFullYear(), cur.getMonth(), 1), dim = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate(), n = Math.ceil((((first.getDay() + 6) % 7) + dim) / 7) * 7;
      h = '<div class="grid" style="grid-template-rows:auto repeat(' + (n / 7) + ',1fr)">' + head();
      for (var i = 0; i < n; i++) {
        var d = add(s, i), c = "d" + (d.getMonth() !== cur.getMonth() ? " out" : "") + (same(d, now) ? " today" : "");
        h += '<div class="' + c + '"><span>' + pad(d.getDate()) + "</span></div>";
      }
      h += "</div>";
    } else if (view === "W") {
      var m = monday(cur);
      h = '<div class="grid wk" style="grid-template-rows:auto 1fr">' + head();
      for (var j = 0; j < 7; j++) { var w = add(m, j); h += '<div class="d' + (same(w, now) ? " today" : "") + '"><span>' + pad(w.getDate()) + "</span></div>"; }
      h += "</div>";
    } else if (view === "D") {
      h = '<div class="big">' + DOW[(cur.getDay() + 6) % 7] + "<b>" + pad(cur.getDate()) + "</b>" + MONTHS[cur.getMonth()] + "</div>";
    } else {
      h = '<div class="agenda">no events</div>';
    }
    $("body").innerHTML = h;
  }
  function move(n) {
    if (view === "M") cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1);
    else if (view === "W") cur = add(cur, 7 * n);
    else cur = add(cur, n);
    render();
  }
  $("pv").onclick = function () { move(-1); };
  $("nx").onclick = function () { move(1); };
  $("yp").onclick = function () { cur = new Date(cur.getFullYear() - 1, cur.getMonth(), 1); render(); };
  $("yn").onclick = function () { cur = new Date(cur.getFullYear() + 1, cur.getMonth(), 1); render(); };
  $("td").onclick = function () { cur = new Date(now.getFullYear(), now.getMonth(), now.getDate()); render(); };
  Array.prototype.forEach.call(document.querySelectorAll(".views button"), function (b) { b.onclick = function () { view = b.dataset.v; render(); }; });
  render();
})();
</script>
</body>
</html>
